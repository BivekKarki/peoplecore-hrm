version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: peoplecore-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: peoplecore
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: peoplecore_hrm
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peoplecore -d peoplecore_hrm"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: peoplecore-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://peoplecore:${DB_PASSWORD:-changeme}@db:5432/peoplecore_hrm
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production-to-a-secure-random-string}
      JWT_EXPIRES_IN: 7d
      NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:3000}
      NODE_ENV: production
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/auth || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
